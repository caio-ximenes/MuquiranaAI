[project]
name = "chatbot-financas"
version = "0.1.0"
description = "Chatbot de organização financeira, controle seus gastos e ganhos e pergunte informações sobre eles."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "langchain>=1.4.3",
    "langchain-groq>=1.1.3",
    "pytest>=9.1.1",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
chatbot-financas = "chatbot_financas:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "main:app"

